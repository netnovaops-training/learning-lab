name: sync-from-toolbox

# Copies my finished, showcased work from the public Toolbox repo into this portfolio:
# work/, LESSONS.md and the "Latest work" part of README.md. Runs every morning and
# whenever I press "Run workflow". Toolbox is public, so no token or secret is needed.

on:
  schedule:
    - cron: '17 11 * * *'   # daily, 11:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-from-toolbox
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Get the Toolbox (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: netnovaops-training/Toolbox
          ref: main
          path: .toolbox
          persist-credentials: false
      - name: Copy showcased work
        run: python3 -I scripts/sync_from_toolbox.py .toolbox
      - name: Commit if changed
        run: |
          rm -rf .toolbox
          if [ -z "$(git status --porcelain)" ]; then echo "No changes."; exit 0; fi
          git config user.name  "portfolio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync showcased work from Toolbox [skip ci]"
          for _ in 1 2 3; do
            git pull --rebase -q origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
